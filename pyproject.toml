[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnoselab"
version = "0.1.0"
description = "Exact tiny CNF conflicts, repairs and hitting-set dual witnesses"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Midya Rahmani"}]

[project.scripts]
diagnoselab = "diagnoselab.cli:main"

[tool.setuptools.packages.find]
include = ["diagnoselab*"]
